name: adversary

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=false
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_MAP_STYLE_LIGHT: ${VITE_MAP_STYLE_LIGHT:-http://tiles.adversary/styles/liberty/style.json}
        VITE_MAP_STYLE_DARK: ${VITE_MAP_STYLE_DARK:-http://tiles.adversary/styles/dark/style.json}
        VITE_GEO_TILEJSON_URL: ${VITE_GEO_TILEJSON_URL:-http://tiles.adversary/data/openmaptiles.json}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api.adversary}
    init: true
    env_file:
      - path: .env
        required: false
    labels:
      - traefik.enable=true
      - traefik.http.routers.adversary-web.rule=Host(`app.adversary`)
      - traefik.http.routers.adversary-web.entrypoints=web
      - traefik.http.services.adversary-web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - traefik

  tiles:
    image: maptiler/tileserver-gl:latest
    volumes:
      - ./data/tiles:/data
    command: ["--config", "/data/config.json"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.adversary-tiles.rule=Host(`tiles.adversary`)
      - traefik.http.routers.adversary-tiles.entrypoints=web
      - traefik.http.services.adversary-tiles.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      - traefik

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adversary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adversary}
      POSTGRES_DB: ${POSTGRES_DB:-adversary}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adversary} -d ${POSTGRES_DB:-adversary}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://adversary:adversary@postgres:5432/adversary?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://adversary:adversary@postgres:5432/adversary?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_MODE: ${AUTH_MODE:-off}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-168h}
      MBTILES_PATH: ${MBTILES_PATH:-/data/tiles/openmaptiles.mbtiles}
      GEO_TILEJSON_URL: ${GEO_TILEJSON_URL:-http://tiles.adversary/data/openmaptiles.json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INSTANCE_ID: ${INSTANCE_ID:-}
    volumes:
      - ./data/tiles:/data/tiles:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.adversary-api.rule=Host(`api.adversary`)
      - traefik.http.routers.adversary-api.entrypoints=web
      - traefik.http.services.adversary-api.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
